name: Scheduled Posts

on:
  schedule:
    # Weekdays only - all times in UTC (EST + 5)
    - cron: '30 12 * * 1-5'   # 7:30 AM EST - pre-market
    - cron: '0 15 * * 1-5'    # 10:00 AM EST - mid-morning engage
    - cron: '0 17 * * 1-5'    # 12:00 PM EST - midday
    - cron: '30 20 * * 1-5'   # 3:30 PM EST - power hour
    - cron: '0 22 * * 1-5'    # 5:00 PM EST - after-hours engage

  workflow_dispatch:
    inputs:
      post_type:
        description: 'Type of post to create'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - eod
          - volatility
          - question
          - contrarian
          - commentary
          - thread_starter
          - engage

concurrency:
  group: social-agent-post
  cancel-in-progress: false

jobs:
  post:
    name: Create & Publish Post
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers for image generation
        run: python -m playwright install --with-deps chromium

      - name: Determine post type
        id: post_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.post_type }}" >> $GITHUB_OUTPUT
            echo "mode=post" >> $GITHUB_OUTPUT
          else
            # Determine based on schedule and day of week
            CRON="${{ github.event.schedule }}"
            DOW=$(date +%u)  # 1=Monday, 5=Friday

            if [ "$CRON" = "30 12 * * 1-5" ]; then
              # 7:30 AM pre-market: rotate trade/question/contrarian
              # Mon=trade, Tue=question, Wed=contrarian, Thu=trade, Fri=question
              case $DOW in
                1) echo "type=morning" >> $GITHUB_OUTPUT ;;
                2) echo "type=question" >> $GITHUB_OUTPUT ;;
                3) echo "type=contrarian" >> $GITHUB_OUTPUT ;;
                4) echo "type=morning" >> $GITHUB_OUTPUT ;;
                5) echo "type=question" >> $GITHUB_OUTPUT ;;
              esac
              echo "mode=post" >> $GITHUB_OUTPUT
            elif [ "$CRON" = "0 15 * * 1-5" ]; then
              # 10:00 AM engage slot: reply to trending FinTwit tweets
              echo "type=engage" >> $GITHUB_OUTPUT
              echo "mode=engage" >> $GITHUB_OUTPUT
            elif [ "$CRON" = "0 17 * * 1-5" ]; then
              # 12:00 PM midday: rotate commentary/thread_starter/volatility
              # Mon=commentary, Tue=thread_starter, Wed=volatility, Thu=commentary, Fri=thread_starter
              case $DOW in
                1) echo "type=commentary" >> $GITHUB_OUTPUT ;;
                2) echo "type=thread_starter" >> $GITHUB_OUTPUT ;;
                3) echo "type=volatility" >> $GITHUB_OUTPUT ;;
                4) echo "type=commentary" >> $GITHUB_OUTPUT ;;
                5) echo "type=thread_starter" >> $GITHUB_OUTPUT ;;
              esac
              echo "mode=post" >> $GITHUB_OUTPUT
            elif [ "$CRON" = "30 20 * * 1-5" ]; then
              # 3:30 PM power hour: always eod trade
              echo "type=eod" >> $GITHUB_OUTPUT
              echo "mode=post" >> $GITHUB_OUTPUT
            elif [ "$CRON" = "0 22 * * 1-5" ]; then
              # 5:00 PM after-hours engage slot
              echo "type=engage" >> $GITHUB_OUTPUT
              echo "mode=engage" >> $GITHUB_OUTPUT
            else
              echo "type=morning" >> $GITHUB_OUTPUT
              echo "mode=post" >> $GITHUB_OUTPUT
            fi
          fi
          echo "Selected: mode=$(grep mode $GITHUB_OUTPUT | cut -d= -f2) type=$(grep type $GITHUB_OUTPUT | cut -d= -f2)"

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPHA_COPILOT_API_KEY: ${{ secrets.ALPHA_COPILOT_API_KEY }}
          ALPHA_COPILOT_API_URL: ${{ secrets.ALPHA_COPILOT_API_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_EMAIL: ${{ secrets.SUPABASE_EMAIL }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          ENABLE_PROMO_POST: "false"
          DRY_RUN: "false"
        run: |
          MODE="${{ steps.post_type.outputs.mode }}"
          TYPE="${{ steps.post_type.outputs.type }}"

          if [ "$MODE" = "engage" ]; then
            echo "Running engage mode..."
            python -m agent.main --engage
          else
            echo "Creating $TYPE post..."
            python -m agent.main --post $TYPE
          fi
